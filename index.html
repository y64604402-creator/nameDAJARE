main{max-width:480px;margin:0 auto}
h1,.big{font-family:'Dela Gothic One',sans-serif;font-weight:400;margin:0}
h1{font-size:34px;line-height:1.15;margin:8px 0 4px}
p{margin:6px 0}
.sub{opacity:.7;font-size:14px}
.big{font-size:clamp(56px,22vw,96px);line-height:1;text-align:center;margin:18px 0;background:var(--yel);border:3px solid var(--ink);border-radius:18px;padding:22px 8px;box-shadow:6px 6px 0 var(--ink);word-break:keep-all}
input{width:100%;font:inherit;font-size:18px;padding:13px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);margin:6px 0}
button{font:inherit;font-weight:700;font-size:18px;width:100%;padding:14px;border:3px solid var(--ink);border-radius:12px;background:var(--pink);color:#fff;box-shadow:4px 4px 0 var(--ink);margin:10px 0}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button.ghost{background:#fff;color:var(--ink)}
button:disabled{opacity:.45}
input:focus-visible,button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:2px dashed #b9c6ea;gap:8px}
.list{background:var(--card);border:3px solid var(--ink);border-radius:14px;margin:10px 0}
.list .row:last-child{border-bottom:0}
.tag{font-size:12px;background:var(--ink);color:#fff;border-radius:99px;padding:2px 9px}
.ok{background:var(--pink)}
.timer{font-family:'Dela Gothic One';font-size:28px;text-align:right}
.res{background:var(--card);border:3px solid var(--ink);border-radius:14px;padding:12px;margin:10px 0}
.res .txt{font-size:18px;margin:4px 0;word-break:break-all}
.pts{font-family:'Dela Gothic One';font-size:34px;color:var(--pink);line-height:1}
.br{font-size:13px;opacity:.75}
.err{color:#c0002e;font-weight:700;min-height:1.3em}
.hide{display:none}

.av{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);object-fit:cover;background:var(--yel);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;overflow:hidden}
.av.sm{width:34px;height:34px;font-size:14px}
.av.lg{width:60px;height:60px;font-size:26px;cursor:pointer}
.nrow{display:flex;gap:10px;align-items:center;margin:6px 0}
.nrow input{margin:0}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.res{display:flex;gap:10px;align-items:flex-start}
.res .mid{flex:1;min-width:0}
</style>
</head>
<body>
<main>
<section id="s-join">
  <h1>名前ダジャレバトル</h1>
  <p class="sub">お題の名前でダジャレを作って、AIに採点してもらおう。丸いアイコンをタップすると、自分の写真に変えられます。</p>
  <div class="nrow"><label class="av lg" id="avBtn" for="iconFile" title="タップして写真に変更"></label><input id="name" maxlength="10" placeholder="あなたの名前"><input type="file" id="iconFile" accept="image/*" class="hide"></div>
  <input id="room" maxlength="16" placeholder="ルームコード(例: 1234)">
  <div class="err" id="err"></div>
  <button id="btnJoin">部屋に入る</button>
  <button class="ghost" id="btnSolo">ひとりで特訓</button>
  <p class="sub">友だちと同じルームコードを入れると集まれます。最初に入った人がホストになります。</p>
  <p class="sub">AI採点は、ホスト(または特訓する人)の端末で行われます。初回に「Puter」のログイン画面が出たら、無料アカウントでログインしてください。ログインしない・失敗したときは簡易採点になります。</p>
</section>

<section id="s-lobby" class="hide">
  <h1>ロビー</h1>
  <p class="sub">ルームコード: <b id="lcode"></b>(友だちに教えよう)</p>

<script>
const $ = id => document.getElementById(id);
const SCREENS = ['join','lobby','play','wait','result','final'];
const show = n => SCREENS.forEach(s => $('s-' + s).classList.toggle('hide', s !== n));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

let isSolo = false, leaving = false, ws, myId = null, hostId = null, players = [], deadline = 0, tick = null, pingT = null, submitted = false;
$('name').value = localStorage.getItem('dj_name') || '';

const iconFor = id => (id === 'me' || id === myId) ? myIcon : (icons[id] || '');
function avatar(id, name, cls) {

}
function renderAvBtn() {

}
async function makeIcon(file) {
  const bmp = await createImageBitmap(file), c = document.createElement('canvas'); c.width = c.height = 96;
  const s = Math.min(bmp.width, bmp.height);
  c.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, 96, 96);
  return c.toDataURL('image/jpeg', 0.7);
}

$('iconFile').onchange = async e => {

  catch (_) { $('err').textContent = '画像を読み込めませんでした'; }
  e.target.value = '';
};
$('room').value = localStorage.getItem('dj_room') || '';

const RULES = `あなたは日本語ダジャレ大会の審査員です。お題の名前に対する各回答を採点します。
ルール:
- 必須条件: 回答文に、お題の名前そのもの(その人を指す名前)が必ず入っていること。入っていなければ全体で0点。
- フルネームのお題(姓・名が別に渡される。お題は姓と名をつなげた文字列。スペースの有無は問わない): 回答にはフルネーム全体がそのまま入っていること(必須)。ダジャレは、名だけ・姓だけ・フルネーム全体・姓と名を別々にダジャレ化、のどれでも成立する。姓と名の両方(または全体)をうまく隠したものほど高く、片方だけでも成立として採点する(例: たんしょけいた→「たんしょけいたが抜く短小チン毛、いた」は、たんしょ(う)とけいたを別々に隠した高評価)。
- ダジャレ成立: 上の名前とは別に、名前と同じ音が別の意味の言葉として文中に自然に含まれていること。この2つが揃って成立(例: ゆうな→「ゆうなを悪くゆうな」は、名前のゆうな+「言うな」。「悪くゆうな」だけは名前が無いので不成立。名前を2回繰り返すだけも不成立)。
- 韻を踏んでいるだけ(音が入っていない)はダジャレ不成立。pun=0。
- 救済ルール: 名前の音の間に1文字程度の挿入、小さい文字の変換(っ↔つ、ゃ↔や等)は許可。ただし使うと減点(trick、-15〜0)。名前が短いほど減点を大きく。
- 韻(rhyme): ダジャレとは別に、名前や隠した音と母音が似て響き合う別の言葉があること(例: ミカエル→「ミカエル、3日エルサルバドルに帰る」は、3日エルがダジャレ、「に帰る」がエルと響き合う韻)。名前と全く同じ音を別の意味で繰り返す・つなげるのはダジャレであって韻ではないので、rhymeには数えない(0)。ダジャレ成立に加え韻も踏めば高得点。
- 名前をそのまま言うだけ、名前が無関係の文は0点。
- 文の意味: 文として日本語の意味が通っているかを厳しく見る(sense)。名前の音を入れるために言葉を無理やり並べただけ、文法が崩れている、何を言いたいか分からない文は、ダジャレが成立していても sense を低くし、pun も減らす。意味が全く通らない文は全体で20点以下。
- senseは細かく刻まず、意味が伝わるなら満点(10)、伝わらないなら0〜3の二択に近く採点する。funは、笑える・うまい・オチがある、といった面白さをしっかり差をつけて採点する。
採点手順: 先に各回答を全てひらがなに直し(reading)、名前の読みが単語の切れ目をまたいで含まれる箇所を漏れなく探す(hits)。例: 名前「たんしょけいた」→「短小チン毛、いた」=たんしょうちんけいた。「たんしょ(う)」と「けいた」が離れて両方入っている。長音(う・ー)・促音・清濁・小文字の違いは許容するが、使った分はtrickで減点する。単独の名前なら名前全体が隠れているかを確認する(フルネームは上のルール)。見落としがないか確認してから採点する。
配点: pun 0-60, rhyme 0-15, sense(文の意味の通りやすさ) 0-10, fun(面白さ) 0-15, trick -15〜0。score=合計(0-100の整数)。
JSON配列のみ返す(前後の文章やコードブロック禁止):
[{"id":"入力のid","reading":"","hits":[],"pun":0,"rhyme":0,"sense":0,"fun":0,"trick":0,"score":0,"comment":"25字以内の講評"}]`;
async function aiText(payload) {
  if (window.puter && puter.ai) { // キー不要: Puter(無料アカウントでログイン)経由でClaudeを使う
    const res = await puter.ai.chat(RULES + '\n\n入力:\n' + payload, { model: 'claude-sonnet-4-6' });
    const m = res && res.message;
    return typeof res === 'string' ? res : (m ? (Array.isArray(m.content) ? m.content.map(c => c.text || '').join('') : String(m.content)) : String(res));
  }
  return null;
}
async function judgeAll(name, entries, parts) {
  const local = () => entries.map(e => Object.assign({ id: e.id }, localScore(name, e.text, parts)));
  if (!entries.length) return local();
  const payload = JSON.stringify({ お題: name, ...(parts && parts[0] ? { 姓: parts[0], 名: parts[1] } : {}), 回答: entries.map(e => ({ id: e.id, text: e.text })) });
  try {
    const txt = await Promise.race([aiText(payload), new Promise((_, rej) => setTimeout(() => rej(new Error('時間切れ')), 25000))]);
    if (txt == null) return local().map(r => Object.assign(r, { comment: 'Puterが読み込めていません(ネットや広告ブロックを確認)。簡易判定です' }));
    const arr = JSON.parse(txt.slice(txt.indexOf('['), txt.lastIndexOf(']') + 1));
    const n = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(+v || 0)));
    return entries.map(e => {
      const a = arr.find(x => x.id === e.id) || {};
      const pun = n(a.pun, 0, 60), rhyme = pun ? n(a.rhyme, 0, 15) : 0, sense = pun ? n(a.sense, 0, 10) : 0, fun = pun ? n(a.fun, 0, 15) : 0, trick = pun ? n(a.trick, -15, 0) : 0;
      return { id: e.id, pun, rhyme, sense, fun, trick, score: Math.max(0, pun + rhyme + sense + fun + trick), comment: String(a.comment || '').slice(0, 40) };
    });
  } catch (err) { const why = String((err && (err.message || err.error || err.code)) || JSON.stringify(err) || err).slice(0, 60); return local().map(r => Object.assign(r, { comment: 'AI採点に失敗(' + why + ')。簡易判定です' })); }
}

// ===== ホストのブラウザで動くゲーム進行(サーバーの代わり) =====
const ROUNDS = 5, ROUND_MS = 30000, RESULT_MS = 6000;
let H = null;
const genId = () => Math.random().toString(36).slice(2, 10);
const hBc = o => H.players.forEach(p => p.send(o));
function hHostId() { let b = null; for (const [id, p] of H.players) if (!b || p.joinedAt < H.players.get(b).joinedAt) b = id; return b; }
const hInfo = () => ({ t: 'room', phase: H.phase, hostId: hHostId(), players: [...H.players].map(([id, p]) => ({ id, name: p.name, total: p.total, done: p.sub !== null })) });
function hJoin(send, m) {
  if (H.players.size >= 8) { send({ t: 'error', msg: '部屋が満員です(最大8人)' }); return null; }
  if (H.phase !== 'lobby' && H.phase !== 'final') { send({ t: 'error', msg: 'ゲーム進行中です。終わるまで待ってね' }); return null; }
  const id = genId();
  const icon = (typeof m.icon === 'string' && m.icon.length <= 30000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(m.icon)) ? m.icon : '';
  H.players.set(id, { send, name: String(m.name || 'ななし').slice(0, 10), icon, total: 0, sub: null, joinedAt: Date.now() });
  send({ t: 'welcome', id, room: H.code }); hBc(hInfo());
  hBc({ t: 'icons', icons: Object.fromEntries([...H.players].map(([i, q]) => [i, q.icon])) });
  return id;
}
function hLeave(id) {
  if (!H || !H.players.has(id)) return;
  H.players.delete(id); hBc(hInfo());
  if (H.phase === 'play' && H.players.size && [...H.players.values()].every(p => p.sub !== null)) hScore();
}
function hStart() { H.round = 0; H.used = []; H.players.forEach(p => { p.total = 0; }); hNext(); }
function hNext() {
  H.round++; const pk = pickName(H.used);
  H.name = pk.name; H.disp = pk.disp || pk.name; H.sei = pk.sei || ''; H.mei = pk.mei || ''; H.used.push(H.name);
  H.phase = 'play'; H.players.forEach(p => { p.sub = null; });
  hBc({ t: 'round', round: H.round, rounds: ROUNDS, name: H.name, disp: H.disp, ms: ROUND_MS }); hBc(hInfo());
  clearTimeout(H.timer); H.timer = setTimeout(hScore, ROUND_MS + 500);
}
async function hScore() {
  if (!H || H.phase !== 'play') return;
  clearTimeout(H.timer); H.phase = 'scoring'; hBc({ t: 'scoring' });
  const entries = [...H.players].filter(([, p]) => p.sub).map(([id, p]) => ({ id, text: p.sub }));
  const res = await judgeAll(H.name, entries, [H.sei, H.mei]);
  if (!H) return;
  const results = [...H.players].map(([id, p]) => {
    const r = res.find(x => x.id === id) || { pun: 0, rhyme: 0, sense: 0, fun: 0, trick: 0, score: 0, comment: '未提出' };
    p.total += r.score; return Object.assign({}, r, { id, name: p.name, text: p.sub || '' });
  }).sort((a, b) => b.score - a.score);
  H.phase = 'result'; hBc({ t: 'result', name: H.name, disp: H.disp, round: H.round, rounds: ROUNDS, results }); hBc(hInfo());
  H.timer = setTimeout(() => {
    if (H.round < ROUNDS) return hNext();
    H.phase = 'final';
    hBc({ t: 'final', ranking: [...H.players].map(([id, p]) => ({ id, name: p.name, total: p.total })).sort((a, b) => b.total - a.total) });
    hBc(hInfo());
  }, RESULT_MS);
}
function hOnMsg(id, m) {
  if (!H || !H.players.has(id)) return;
  const p = H.players.get(id);
  if (m.t === 'start' && id === hHostId() && (H.phase === 'lobby' || H.phase === 'final') && H.players.size >= 2) hStart();
  else if (m.t === 'submit' && H.phase === 'play' && p.sub === null) {
    p.sub = String(m.text || '').trim().slice(0, 60) || '(無回答)'; hBc(hInfo());
    if ([...H.players.values()].every(x => x.sub !== null)) hScore();
  }
  else if (m.t === 'again' && id === hHostId() && H.phase === 'final') { H.phase = 'lobby'; hBc(hInfo()); hBc({ t: 'lobby' }); }
  else if (m.t === 'leave' && id !== H.myId) hLeave(id);
}
function hostShutdown() {
  if (!H) return;
  clearTimeout(H.timer); H.players.forEach((p, id) => { if (id !== H.myId) p.send({ t: 'closed' }); });
  const pr = H.peer; H = null; setTimeout(() => { try { pr.destroy(); } catch (e) {} }, 300);
}
function onDisconnected(msg) {
  clearInterval(tick); myId = null; ws = null; show('join'); $('btnJoin').disabled = false; $('err').textContent = msg || '';
}

// ===== 接続(PeerJSで端末どうしを直接つなぐ。最初に入った人がホスト) =====
function connect() {
  isSolo = false; leaving = false;
  const name = $('name').value.trim() || 'ななし', room = $('room').value.trim() || 'LOBBY';
  localStorage.setItem('dj_name', name); localStorage.setItem('dj_room', room);
  $('err').textContent = '接続中…'; $('btnJoin').disabled = true;
  const code = room.toUpperCase().replace(/[^A-Z0-9]/g, '') || 'LOBBY', hostPeerId = 'dajare-battle-' + code;
  const join = { t: 'join', name, icon: myIcon };
  const fail = msg => { $('err').textContent = msg; $('btnJoin').disabled = false; };
  if (typeof Peer === 'undefined') return fail('通信の部品を読み込めませんでした。ネットを確認してね');
  const p1 = new Peer(hostPeerId);
  p1.on('open', () => {
    H = { code, players: new Map(), phase: 'lobby', round: 0, used: [], timer: null, peer: p1 };
    H.myId = hJoin(o => setTimeout(() => handle(o), 0), join);
    ws = { readyState: 1, send: s => { try { hOnMsg(H.myId, JSON.parse(s)); } catch (e) {} }, close: () => { leaving = true; hostShutdown(); onDisconnected(''); } };
  });
  p1.on('connection', conn => {
    let id = null;
    conn.on('data', d => {
      let m; try { m = JSON.parse(d); } catch (e) { return; }
      if (!H) return;
      if (m.t === 'join' && !id) { id = hJoin(o => { if (conn.open) conn.send(JSON.stringify(o)); }, m); if (!id) setTimeout(() => conn.close(), 500); }
      else if (id) hOnMsg(id, m);
    });
    conn.on('close', () => { if (id) hLeave(id); });
  });
  p1.on('error', e => {
    if (e.type !== 'unavailable-id') return fail('接続できません(' + e.type + ')');
    p1.destroy();
    const p2 = new Peer();
    p2.on('error', e2 => fail(e2.type === 'peer-unavailable' ? '部屋が見つかりません。もう一度試してね' : '接続できません(' + e2.type + ')'));
    p2.on('open', () => {
      const conn = p2.connect(hostPeerId, { reliable: true });
      const to = setTimeout(() => { fail('部屋につながりません'); try { p2.destroy(); } catch (_) {} }, 15000);
      conn.on('open', () => {
        clearTimeout(to);
        ws = { readyState: 1, send: s => { if (conn.open) conn.send(s); }, close: () => { leaving = true; try { p2.destroy(); } catch (_) {} onDisconnected(''); } };
        conn.send(JSON.stringify(join));
      });
      conn.on('data', d => { try { handle(JSON.parse(d)); } catch (_) {} });
      conn.on('close', () => { if (ws) onDisconnected(leaving ? '' : '切断されました(ホストが抜けた可能性があります)'); });
    });
  });
}
const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

const NAMES_JP = ['ゆうな','じょうしゃ','さくら','たくみ','ひろし','あかね','けんた','みなと','かえで','りょうた','まさき','なつき','ゆうき','はるか','ひなた','しょうた','あおい','だいすけ','ことね','いくと','かおり','アキタ','たけし','まなぶ','ひとみ','みさき','かずき','けいすけ','ゆうた','りな','ののか','いおり','そうた','はると','れん','ゆいな','みゆ','あやか','さやか','ともき','こうた','しんじ','だいき','まこと','のぞみ','めぐみ','ちひろ','ゆかり','かなた','ひかる','つばさ','あすか','まりこ','えいた','かずま','よしお','たかし','ゆきお','のぶお','みつる','くにお','しずか','いずみ','ちさと','はなこ','たろう','じろう','さぶろう','すぐる','いさお','あつし','まさる','きよし','とおる','ひでき','なおき','かいと','りく','そら','ゆま','みお','ひまり','いちか','こはる','あかり','ゆず','るな','ここな','みつき','おさむ','たいが','げんき','こうき','ゆうと','しゅん','ほのか','めい','ゆあ','れいな','さとし','ともこ','やすし','いさむ','ひろき','みのる','かんな','ふみや','ゆきな','さとる','まゆみ','ひろみ','きよみ','あきら','しょうご','りゅうき','かすみ','ちなつ','みかん','もも','いちご','ひなこ','たまき','とうま','まひろ','あいり','かのん','ゆうせい','けんじ','たけひこ','まさと','ゆうすけ','てるみ','あきこ','かおる','ひさし'];

const SURNAMES = ['たけした','たんしょ','たなか','すずき','さとう','たかはし','いとう','わたなべ','やまもと','なかむら','こばやし','かとう','よしだ','やまだ','ささき','やまぐち','まつもと','いのうえ','きむら','はやし','しみず','やまざき','もり','いけだ','はしもと','あべ','いしかわ','やました','なかじま','いしい','おがわ','まえだ','おかだ','はせがわ','ふじた','ごとう','こんどう','むらた','うえだ','さかもと','えんどう','あおき','ふくだ','にしむら','みうら','ふじわら','おかもと','まつだ','なかがわ','なかの','はらだ','おの','たむら','たけうち','かねこ','わだ','なかやま','いしだ','うえの','もりた','はら','しばた','さかい','くどう','よこやま','みやざき','みやもと','うちだ','たかぎ','あんどう','たにぐち','おおの','まるやま','いまい','たかだ','ふじい','たけだ','かねだ','こじま','ほんだ'];
// 名前の出し方: 海外 1/7 / 日本のうちフルネーム 1/8、苗字だけ 約2割(下の名前より少なめ)、残りは下の名前
function pickName(used) {
  const pick = arr => { const f = arr.filter(n => !used.includes(n)); const a = f.length ? f : arr; return a[Math.floor(Math.random() * a.length)]; };
  if (Math.random() < 1 / 7) return { name: pick(NAMES_WORLD) };
  const r = Math.random();
  if (r < 1 / 8) { const s = SURNAMES[Math.floor(Math.random() * SURNAMES.length)], g = NAMES_JP[Math.floor(Math.random() * NAMES_JP.length)]; return { name: s + g, disp: s + ' ' + g, sei: s, mei: g }; }
  if (r < 1 / 8 + 7 / 8 * 0.2) return { name: pick(SURNAMES) };
  return { name: pick(NAMES_JP) };
}
let soloUsed = [], soloN = 0, soloName = '', soloDisp = '', soloSei = '', soloMei = '';
function setBig(disp) {
  $('oName').textContent = disp;
  const L = Math.max(3, ...disp.split(' ').map(x => x.length));
  $('oName').style.fontSize = 'min(' + Math.floor(80 / L) + 'vw, 96px)';
}
const kata2hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
function localScore(name, text, parts) {
  const norm = x => kata2hira(x).replace(/[\s、。,.!?！？「」]/g, ''), t = norm(text), n = norm(name);
  const cnt = w => { let c = 0, i = -1; while (w && (i = t.indexOf(w, i + 1)) !== -1) c++; return c; };
  const full = parts && parts[0];
  const ok = full ? (cnt(n) >= 1 && (cnt(n) >= 2 || cnt(norm(parts[0])) >= 2 || cnt(norm(parts[1])) >= 2)) : cnt(n) >= 2;
  const kanji = /[一-龠]/.test(text) ? ' 漢字は読めないので、ひらがなで書くと正確です。' : '';
  const pun = ok ? 40 : 0;
  return { pun, rhyme: 0, sense: 0, fun: 0, trick: 0, score: pun, simple: true,
    comment: (ok ? '名前の音が別の意味でも入っています。' : cnt(n) >= 1 ? '名前は入っています。別の意味の同じ音も隠そう。' : '名前が入っていません。') + kanji };
}
function soloStart() { isSolo = true; myId = 'me'; soloUsed = []; soloN = 0; soloRound(''); }
function soloRound(custom) {
  custom = (custom || '').trim().slice(0, 20); soloN++;
  if (soloUsed.length >= NAMES_JP.length + NAMES_WORLD.length + SURNAMES.length) soloUsed = [];
  const pk = custom ? { name: custom } : pickName(soloUsed);
  soloName = pk.name; soloDisp = pk.disp || pk.name; soloSei = pk.sei || ''; soloMei = pk.mei || ''; if (!custom) soloUsed.push(soloName);
  submitted = false; $('ans').value = ''; $('ans').disabled = false; $('btnSubmit').disabled = false;
  $('rinfo').textContent = '特訓 ' + soloN + '問目'; $('timer').textContent = ''; setBig(soloDisp);
  $('pstate').classList.add('hide'); show('play'); $('ans').focus();
}
async function soloSubmit(text) {
  submitted = true; $('ans').disabled = true; $('btnSubmit').disabled = true; show('wait');
  const [r] = await judgeAll(soloName, [{ id: 'me', text }], [soloSei, soloMei]);
  showResult({ name: soloName, disp: soloDisp, round: soloN, rounds: 0, results: [Object.assign({ name: $('name').value.trim() || 'あなた', text }, r, { id: 'me' })] });
}

function renderPlayers(box, showDone) {
  box.replaceChildren();
  players.forEach(p => {
    const r = el('div', 'row'), l = el('span', 'who');
    l.append(avatar(p.id, p.name, 'sm'), el('span', '', p.name + (p.id === myId ? '(あなた)' : '') + (p.id === hostId ? ' 👑' : '')));
    const right = el('span');
    if (showDone) right.append(el('span', 'tag' + (p.done ? ' ok' : ''), p.done ? '提出済' : '考え中'));
    else right.append(el('span', 'sub', p.total + '点'));
    r.append(l, right); box.append(r);
  });
}

function handle(m) {
  switch (m.t) {
    case 'welcome': myId = m.id; $('lcode').textContent = m.room; $('err').textContent = ''; if (!m.solo) show('lobby'); break;
    case 'error': $('err').textContent = m.msg; break;
    case 'room':
      players = m.players; hostId = m.hostId;
      renderPlayers($('lplayers'), false); renderPlayers($('pstate'), true);
      const host = myId === hostId;
      $('btnStart').classList.toggle('hide', !host); $('btnStart').disabled = players.length < 2;
      $('waitHost').textContent = host ? (players.length < 2 ? '2人以上そろうと開始できます' : '') : '👑ホストの開始を待っています';
      $('btnAgain').classList.toggle('hide', !host); $('fWait').textContent = host ? '' : '👑ホストを待っています';
      renderTotals(); break;
    case 'icons': Object.assign(icons, m.icons); renderPlayers($('lplayers'), false); renderPlayers($('pstate'), true); renderTotals(); break;
    case 'lobby': show('lobby'); break;
    case 'closed': onDisconnected('ホストが退出したので終了しました'); break;
    case 'round':
      submitted = false; $('ans').value = ''; $('ans').disabled = false; $('btnSubmit').disabled = false;
      $('rinfo').textContent = m.rounds ? 'ラウンド ' + m.round + ' / ' + m.rounds : '特訓 ' + m.round + '問目'; setBig(m.disp || m.name);
      deadline = Date.now() + m.ms; clearInterval(tick); $('timer').textContent = ''; $('pstate').classList.remove('hide');
      if (m.ms) tick = setInterval(() => { $('timer').textContent = Math.max(0, Math.ceil((deadline - Date.now()) / 1000)); }, 250);
      show('play'); $('ans').focus(); break;
    case 'scoring': clearInterval(tick); show('wait'); break;
    case 'result': showResult(m); break;
    case 'final':
      $('fList').replaceChildren();
      m.ranking.forEach((p, i) => {
        const r = el('div', 'row'), l = el('span', 'who'); l.append(el('span', '', i === 0 ? '🏆' : (i + 1) + '位'), avatar(p.id, p.name, 'sm'), el('span', '', p.name + (p.id === myId ? '(あなた)' : '')));
        r.append(l, el('span', 'pts', p.total + '点'));
        $('fList').append(r);
      });
      show('final'); break;
  }
}

function renderTotals() { renderPlayers($('rTotals'), false); }

function showResult(m) {
  $('rTitle').textContent = '「' + (m.disp || m.name) + '」の結果';
  $('rList').replaceChildren();
  m.results.forEach(r => {
    const c = el('div', 'res'), mid = el('div', 'mid');
    mid.append(el('b', '', r.name + (r.id === myId ? '(あなた)' : '')), el('div', 'txt', r.text || '(未提出)'));
    if (isSolo) mid.append(el('div', 'br', r.simple ? '簡易判定(AI未接続。名前の音が入っているかだけ)' : 'ダジャレ ' + r.pun + ' / 韻 ' + r.rhyme + ' / 意味 ' + r.sense + ' / 面白さ ' + r.fun + ' / 救済減点 ' + r.trick));
    mid.append(el('div', 'br', r.comment));
    c.append(avatar(r.id, r.name, ''), mid, el('span', 'pts', r.score));
    $('rList').append(c);
  });
  $('soloBox').classList.toggle('hide', !isSolo); $('rTotals').classList.toggle('hide', isSolo); $('soloName').value = '';
  $('rNext').textContent = isSolo ? '' : (m.round < m.rounds ? 'まもなく次のラウンド…' : 'まもなく最終結果…');
  show('result');
}

function submit() {
  if (submitted) return; const t = $('ans').value.trim(); if (!t) return;
  if (isSolo) return soloSubmit(t);
  submitted = true; send({ t: 'submit', text: t }); $('ans').disabled = true; $('btnSubmit').disabled = true;
}

$('btnJoin').onclick = connect;
$('btnSolo').onclick = soloStart;
$('btnSoloNext').onclick = () => soloRound($('soloName').value);
$('btnSoloQuit').onclick = () => { isSolo = false; myId = null; show('join'); };
$('btnStart').onclick = () => send({ t: 'start' });
$('btnAgain').onclick = () => send({ t: 'again' });
$('btnSubmit').onclick = submit;
$('ans').onkeydown = e => { if (e.key === 'Enter') submit(); };
$('btnLeave1').onclick = () => { leaving = true; send({ t: 'leave' }); ws.close(); };
</script>
